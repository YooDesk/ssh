name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build one platform for diagnosis, or all platforms for release
        type: choice
        default: all
        options: [all, windows-x86, windows-x64, windows-arm64, linux-x64, linux-arm64, linux-loong64, linux-loong64-oldworld, linux-mips64el, macos-arm64, macos-x64]
      source_ref:
        description: Exact source commit for a reviewed build-only adapter
        type: string
        default: ''
      release_id:
        description: Prepared draft release ID for a historical source_ref
        type: string
        default: ''
      reuse_run_id:
        description: Completed run at source_ref with verified native artifacts
        type: string
        default: ''

permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
env:
  RUST_VERSION: '1.99.0'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_CMAKE_VERSION: '4.3.0'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  targets:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          SOURCE_REF: ${{ inputs.source_ref }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python ci/build_matrix.py >> "$GITHUB_OUTPUT"

  browser:
    needs: targets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts

      - name: Build browser assets once for all native targets
        run: node ci/browser.mjs ssh
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: browser/
          if-no-files-found: error
  native:
    env:
      YOODESK_SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
    needs: [browser, targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.targets.outputs.source_sha }}
      - name: Apply reviewed build-only adapters to the pinned source
        if: inputs.source_ref != ''
        shell: bash
        env:
          BUILD_TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --depth 1 origin "$BUILD_TOOLS_SHA"
          git show "$BUILD_TOOLS_SHA:ci/build_adapters.py" > "$RUNNER_TEMP/yoodesk-build-adapters.py"
          python "$RUNNER_TEMP/yoodesk-build-adapters.py" "$YOODESK_SOURCE_SHA" "$BUILD_TOOLS_SHA"
      # Windows 的 build.rs 用这里的 Node 依赖生成可执行文件图标。
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the native icon generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm ci --prefix frontend --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: browser
          path: browser/

      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache/
            target/
            desk-engine/target/
          key: native-ssh-${{ matrix.platform }}-rust199-ubuntu18-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-ssh-${{ matrix.platform }}-rust199-ubuntu18-v3-
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          # x64 build scripts can load the exact LLVM 15 used by RustDesk, also on the ARM runner.
          toolchain: '1.99.0-x86_64-pc-windows-msvc'
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      # macOS 也使用固定 rustc 版本，避免 runner 预装工具链漂移。
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}

      - name: Build Windows native code and run tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
          _CL_: '/MT'
        run: |
          $env:GITHUB_SHA=$env:YOODESK_SOURCE_SHA
          cargo build --locked --release --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/package.py ssh --platform '${{ matrix.platform }}'
      - name: Build macOS plugin and verify archive
        if: matrix.macos
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add '${{ matrix.target }}'
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          cargo build --locked --release --lib --target '${{ matrix.target }}'
          cargo test --locked --lib --target '${{ matrix.target }}'
          python3 ci/package.py ssh --platform '${{ matrix.platform }}'
          python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Build every Linux native dependency and binary on Ubuntu 18.04
        if: runner.os == 'Linux' && !matrix.cross
        shell: bash
        run: |
          mkdir -p .ci-cache/tools .ci-cache/vcpkg
          docker run --rm \
            -e GITHUB_SHA="$YOODESK_SOURCE_SHA" -e RELEASE_VERSION \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/linux-build.sh ssh '${{ matrix.platform }}' '${{ matrix.target }}' '${{ matrix.triplet }}'
      - name: Cross-compile loong64/mips64el plugin and verify archive under QEMU
        if: matrix.cross && !matrix.oldworld
        timeout-minutes: 240
        shell: bash
        run: |
          mkdir -p .ci-cache/tools
          docker run --rm \
            -e GITHUB_SHA="$YOODESK_SOURCE_SHA" -e RELEASE_VERSION -e RUST_VERSION='${{ env.RUST_VERSION }}' \
            -v "$PWD:/workspace" -v "$PWD/.ci-cache/tools:/opt/yoodesk-tools" \
            ubuntu:18.04 bash /workspace/ci/cross-build.sh '${{ matrix.platform }}' '${{ matrix.target }}' ssh
      - uses: actions/cache/restore@v4
        if: matrix.oldworld
        id: oldworld-inputs
        with:
          path: |
            .ci-cache/oldworld-toolchain.tar.xz
            .ci-cache/oldworld-sysroot-inputs.tar
            .ci-cache/oldworld-upstream-cargo.tar.xz
            .ci-cache/oldworld-debs/
            .ci-cache/cargo-oldworld/
          key: oldworld-inputs-v2-${{ hashFiles('ci/oldworld-tools.lock.json', 'ci/oldworld-sysroot.lock.json', 'ci/oldworld-sysroot-download.lock.json') }}
          restore-keys: oldworld-inputs-v1-
      - name: Build and test the LoongArch old-world ABI 1.0 ssh plugin
        if: matrix.oldworld
        shell: bash
        run: |
          export GITHUB_SHA="$YOODESK_SOURCE_SHA"
          bash ci/oldworld-build.sh ssh
      - uses: actions/cache/save@v4
        if: always() && matrix.oldworld && steps.oldworld-inputs.outputs.cache-hit != 'true'
        with:
          path: |
            .ci-cache/oldworld-toolchain.tar.xz
            .ci-cache/oldworld-sysroot-inputs.tar
            .ci-cache/oldworld-upstream-cargo.tar.xz
            .ci-cache/oldworld-debs/
            .ci-cache/cargo-oldworld/
          key: ${{ steps.oldworld-inputs.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    needs: [native, targets]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        if: inputs.release_id != ''
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          pattern: native-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/
          merge-multiple: true
      - name: Require every platform archive before publishing
        run: |
          for platform in windows-x86 windows-x64 windows-arm64 linux-x64 linux-arm64 linux-loong64 linux-loong64-oldworld linux-mips64el macos-arm64 macos-x64; do
            test -s "dist/yoodesk-ssh-$platform.zip"
            (cd dist && sha256sum -c "yoodesk-ssh-$platform.zip.sha256")
          done
      - name: Verify every archive identifies the pinned runtime source
        env:
          SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, zipfile
          archives = glob.glob('dist/*.zip')
          assert len(archives) == 10
          for archive in archives:
              with zipfile.ZipFile(archive) as bundle:
                  metadata = json.loads(bundle.read('plugin.json'))
                  assert archive == 'dist/yoodesk-ssh-'+metadata['platform']+'.zip', archive
                  assert metadata['id'] == 'ssh' and metadata['abi_version'] == 1, archive
                  assert metadata['source_commit'] == os.environ['SOURCE_SHA'], archive
                  assert hashlib.sha256(bundle.read(metadata['library'])).hexdigest() == metadata['sha256'], archive
          PY
      - name: Upload verified historical-source archives to the prepared release
        if: inputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.targets.outputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 ci/publish_verified_plugins.py
      - uses: softprops/action-gh-release@v2
        if: inputs.release_id == ''
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-ci.{0}', github.run_number) }}
          name: 'ssh ${{ needs.targets.outputs.source_sha }}'
          target_commitish: ${{ needs.targets.outputs.source_sha }}
          body: |
            Runtime source: `${{ needs.targets.outputs.source_sha }}`
            Build configuration: `${{ github.sha }}`
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
